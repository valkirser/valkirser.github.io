name: Sync GN-MATH from its source repository

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the profile website
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Copy GN-MATH from its source repository
        run: |
          git clone --depth 1 --branch main https://github.com/valkirser/gn-math.git /tmp/gn-math-source
          mkdir -p games/gn-math
          cp /tmp/gn-math-source/index.html /tmp/gn-math-source/player.html /tmp/gn-math-source/script.js /tmp/gn-math-source/style.css games/gn-math/

      - name: Commit site output when it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/gn-math/index.html games/gn-math/player.html games/gn-math/script.js games/gn-math/style.css
          if git diff --cached --quiet; then
            echo "GN-MATH site output is already current."
            exit 0
          fi
          git commit -m "Sync GN-MATH from valkirser/gn-math"
          git push origin HEAD:main
