<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GN-MATH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="logo">GN-MATH</div>
  <div class="search-tools">
    <div class="search-wrap">
      <input id="search" placeholder="Search for a game..." autocomplete="off" spellcheck="false">
      <span id="count"></span>
      <div id="clearBtn" title="Clear">✕</div>
      <div id="results"></div>
    </div>
    <button id="randomBtn" type="button" title="Choose a random game" aria-label="Choose a random game">🎲</button>
  </div>
  <div class="filter-wrap">
    <button id="filterBtn">⚙ Filters</button>
    <div id="filterPanel"></div>
  </div>
</header>
<canvas id="c"></canvas>
<div class="vignette"></div>
<button id="playBtn">▶ Play</button><div id="debugPanel" aria-live="off"><strong>GN-MATH DIAGNOSTICS · F8</strong>
Starting…</div>
<div id="status">
  <div id="bootConsole">
    <div id="bootLines"><span id="bootInfo" class="active">Starting GN-MATH on&nbsp;<span id="browserName">your browser</span><span class="boot-dots" aria-hidden="true"><i>.</i><i>.</i><i>.</i></span></span><span id="bootStage">Decoding image 0 of 0... (0%)</span><span id="errbox"></span></div>
    <ul id="bootImageList" aria-live="off"></ul>
    <div id="bootMeta"><span id="bootCount">0 loaded · 0 unavailable</span></div>
  </div>
</div>
<div class="hint"><b>drag</b> to pan &nbsp; <b>scroll</b> to zoom &nbsp; <b>click</b> a planet to zoom in &amp; play</div>
<div id="playerOverlay" aria-hidden="true"><iframe id="playerPageFrame" title="GN-MATH Game Player" allow="autoplay; fullscreen; gamepad; pointer-lock" allowfullscreen></iframe></div><script src="script.js"></script>
</body>
</html>
